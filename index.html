<body>
    <header>
        <h1>Bankoo</h1>
    </header>
    <main>
        <div class="left-container">
            <div class="left-container-header">
                <h1>Clients</h1>
                <div>
                    <!-- déplier tous les comptes bancaires -->
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="clients-container">
                <div class="client-list">
                </div>
                <div class="add-client">
                    <h4>Ajouter un client</h4>
                    <input type="text" class="add-client-input" id="client-name" placeholder="Nom du client" required>
                    <button class="add-client-button" type="submit">Ajouter</button>
                </div>
            </div>
        </div>

        <div class="right-container">
            <div class="right-container-header">
                <div>
                    <!-- déplier tous les comptes bancaires -->
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="right-container-table">

            </div>
        </div>
    </main>
